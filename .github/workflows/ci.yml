name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint + Typecheck + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
        env:
          # unit tests never call out; mock provider path
          MOCK_LLM: 'true'

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @career/server exec prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://career:career@localhost:5432/career_test?schema=public'
      - name: Seed (demo data)
        run: pnpm --filter @career/server run seed
        env:
          DATABASE_URL: 'postgresql://career:career@localhost:5432/career_test?schema=public'
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: 'postgresql://career:career@localhost:5432/career_test?schema=public'
          JWT_ACCESS_SECRET: 'ci-access-secret-000000000000'
          JWT_REFRESH_SECRET: 'ci-refresh-secret-00000000000'
          MOCK_LLM: 'true'